# Argo WorkflowTemplate for parallelizing scripts/73_map_inference.py across
# the remaining tiles.
#
# MUST run inside the EASI Kubernetes cluster: the pipeline calls
# datacube.Datacube() against the Data Cube Chile ODC index, which is only
# reachable from inside EASI (DB_HOSTNAME/PORT/DATABASE/USERNAME/PASSWORD).
# There is no public STAC fallback wired into this code path — see the repo
# README. Everywhere marked EDIT-ME needs a value from you or the EASI
# admins before this can run.
#
# Not included in the public code repo, and not handled by this manifest:
#   - Model artifacts: results/models_unified_topofix/.../model_seed{0..4}.pt
#     (764 kB) and .../oof_predictions.csv (3.2 MB) — small, not flagged as
#     sensitive, but must be baked into the image (private layer) or mounted
#     from a volume. Same for the tiles CSV and the three *_unified_padded
#     parquet files under data/derived/ — check those for coordinates before
#     they go anywhere the image build can see them.
#   - AWS and datacube-index credentials — pulled from k8s Secrets below,
#     never inlined here.
#
# Parallelism model: each pod runs the SAME script as the existing pod's
# workers (chile_gw / chile_pod halves), just on a smaller tile-file slice
# and with the script's own internal parallelism turned off (--workers 0
# --jobs 1) so the concurrency comes entirely from the number of pods, not
# from also fighting the DB index and S3 with threads inside each pod.
#
# Dedup / "don't repeat finished tiles": there's no separate progress
# tracker to keep in sync. argo/tile_progress.py lists what's actually in
# S3 and treats a tile as done only once all its years are there — that's
# what list-missing-tiles calls, and it's the same script you can run by
# hand (from a machine with the AWS creds and boto3) for a live count
# whenever you want one, independent of this workflow or the pod's own
# STATUS.json:
#
#   python argo/tile_progress.py --tiles-csv tiles_native_10km_run.csv \
#     --s3-dest s3://easido-prod-user-scratch/<userid>/biodiv/maps/chile_30m_2000_2026 \
#     --years 2000-2026
#
# The image needs boto3 and the aws cli (fetch-tiles-csv shells out to
# `aws s3 cp`) in addition to the pipeline's own dependencies.

apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: biodiv-map-inference
  namespace: EDIT-ME-easi-namespace
spec:
  entrypoint: main

  # Test run: 3 tiles, 1 per pod, 3 pods max. Once this is verified, raise
  # limit-tiles and num-chunks together (still 1 tile/pod is simplest) and
  # bump parallelism — with EASI admins, since it shares the ODC index and
  # node pool with the jupyterhub pod's chile_gw/chile_pod load.
  parallelism: 3

  arguments:
    parameters:
      - name: image
        # EDIT-ME: built from github.com/JavierLopatin/Biodiversity_argo-process
        # plus the private layer with model artifacts/derived data (see above).
        value: "EDIT-ME-registry/biodiv-map-inference:latest"
      - name: s3-dest
        # Same destination the pod's own workers already write to.
        value: "s3://easido-prod-user-scratch/EDIT-ME-aws-userid/biodiv/maps/chile_30m_2000_2026"
      - name: tiles-csv-s3
        # results/figures/tiles_native_10km_run.csv (tile_id,xmin,ymin,xmax,ymax,
        # UTM 19S), uploaded once to S3 so pods don't need pod-local storage.
        value: "s3://easido-prod-user-scratch/EDIT-ME-aws-userid/biodiv/maps/config/tiles_native_10km_run.csv"
      - name: years
        value: "2000-2026"
      - name: tag
        value: "argo-test1"
      - name: limit-tiles
        # Test run: only take the first 3 tiles that are actually missing
        # (per tile_progress.py against S3 — never a hardcoded/guessed list).
        # Set to "0" for the full remaining backlog once the test is good.
        value: "3"
      - name: num-chunks
        # 1 tile per pod for the test, so 3 tiles -> 3 pods running in
        # parallel. For a full run, raising this past 1 tile/pod just means
        # each pod works through its slice serially — usually not worth it;
        # scale by raising limit-tiles/num-chunks together and parallelism.
        value: "3"

  templates:
    # ---- DAG: fetch tile list -> list what's missing -> split into chunks -> one pod per chunk
    - name: main
      dag:
        tasks:
          - name: fetch-tiles-csv
            template: fetch-tiles-csv

          - name: list-missing-tiles
            template: list-missing-tiles
            dependencies: [fetch-tiles-csv]
            arguments:
              artifacts:
                - name: tiles-csv
                  from: "{{tasks.fetch-tiles-csv.outputs.artifacts.tiles-csv}}"

          - name: split-tiles
            template: split-tiles
            dependencies: [list-missing-tiles]
            arguments:
              artifacts:
                - name: missing-csv
                  from: "{{tasks.list-missing-tiles.outputs.artifacts.missing-csv}}"

          - name: process-chunk
            template: process-chunk
            dependencies: [split-tiles]
            withParam: "{{tasks.split-tiles.outputs.result}}"   # JSON list of chunk ids, e.g. ["0","1",...]
            arguments:
              parameters:
                - name: chunk-id
                  value: "{{item}}"
              artifacts:
                - name: chunk-csv
                  from: "{{tasks.split-tiles.outputs.artifacts.chunks}}/chunk_{{item}}.csv"

    # ---- Step 0: pull tiles-csv-s3 down to a pod-local file so
    # tile_progress.py (and split-tiles after it) can read it as a plain path.
    - name: fetch-tiles-csv
      inputs:
        parameters:
          - name: tiles-csv-s3
            value: "{{workflow.parameters.tiles-csv-s3}}"
      outputs:
        artifacts:
          - name: tiles-csv
            path: /work/tiles.csv
      container:
        image: "{{workflow.parameters.image}}"
        command: [aws, s3, cp, "{{inputs.parameters.tiles-csv-s3}}", /work/tiles.csv]
        envFrom:
          - secretRef:
              name: EDIT-ME-aws-credentials-secret   # read-only S3 access

    # ---- Step 1: full tile list minus what's already complete in S3, via
    # argo/tile_progress.py (shipped in the image) — the same script anyone
    # can run ad hoc for a live "what's done" check, so the Argo run and a
    # human checking progress never disagree about what's finished.
    # A tile counts as done only when every requested year's GeoTIFF
    # (<tile_id>_<year>.tif) exists under s3-dest.
    - name: list-missing-tiles
      inputs:
        parameters:
          - name: s3-dest
            value: "{{workflow.parameters.s3-dest}}"
          - name: years
            value: "{{workflow.parameters.years}}"
          - name: limit-tiles
            value: "{{workflow.parameters.limit-tiles}}"
        artifacts:
          - name: tiles-csv
            path: /work/tiles.csv
      outputs:
        artifacts:
          - name: missing-csv
            path: /work/missing_tiles.csv
      container:
        image: "{{workflow.parameters.image}}"
        workingDir: /app   # EDIT-ME: wherever the image places the repo
        command:
          - python
          - argo/tile_progress.py
          - --tiles-csv
          - /work/tiles.csv
          - --s3-dest
          - "{{inputs.parameters.s3-dest}}"
          - --years
          - "{{inputs.parameters.years}}"
          - --limit
          - "{{inputs.parameters.limit-tiles}}"
          - --out
          - /work/missing_tiles.csv
        envFrom:
          - secretRef:
              name: EDIT-ME-aws-credentials-secret   # read-only S3 access

    # ---- Step 2: split missing_tiles.csv into N roughly-equal chunk files,
    # one per pod. Emits the chunk ids as JSON on stdout for withParam above.
    - name: split-tiles
      inputs:
        artifacts:
          - name: missing-csv
            path: /work/missing_tiles.csv
        parameters:
          - name: num-chunks
            value: "{{workflow.parameters.num-chunks}}"
      outputs:
        artifacts:
          - name: chunks
            path: /work/chunks
        parameters:
          - name: chunk-ids
            valueFrom:
              path: /work/chunk_ids.json
      container:
        image: "{{workflow.parameters.image}}"
        command: [python, -c]
        args:
          - |
            import csv, json, math, os

            rows = list(csv.reader(open("/work/missing_tiles.csv")))
            header, rows = rows[0], rows[1:]
            n = int(os.environ["NUM_CHUNKS"])
            os.makedirs("/work/chunks", exist_ok=True)
            size = math.ceil(len(rows) / n)
            ids = []
            for i in range(n):
                part = rows[i * size:(i + 1) * size]
                if not part:
                    continue
                ids.append(str(i))
                with open(f"/work/chunks/chunk_{i}.csv", "w", newline="") as f:
                    w = csv.writer(f)
                    w.writerow(header)
                    w.writerows(part)
            json.dump(ids, open("/work/chunk_ids.json", "w"))
        env:
          - name: NUM_CHUNKS
            value: "{{inputs.parameters.num-chunks}}"

    # ---- Step 3: one pod per chunk, running the same entry point the pod's
    # own workers use, with --resume so a rerun skips tiles finished meanwhile.
    - name: process-chunk
      inputs:
        parameters:
          - name: chunk-id
        artifacts:
          - name: chunk-csv
            path: /work/chunk.csv
      container:
        image: "{{workflow.parameters.image}}"
        workingDir: /app   # EDIT-ME: wherever the image places the repo
        command: [python, scripts/73_map_inference.py]
        args:
          - --tiles-file
          - /work/chunk.csv
          - --dest
          - "{{workflow.parameters.s3-dest}}"
          - --years
          - "{{workflow.parameters.years}}"
          - --resume
          - --workers
          - "0"          # dask off inside the pod — parallelism is pod count, not threads
          - --jobs
          - "1"
          - --device
          - cpu
          - --tag
          - "{{workflow.parameters.tag}}-{{inputs.parameters.chunk-id}}"
        env:
          - name: BIODIV_UNIFIED
            value: "1"
          - name: BIODIV_CURVES
            value: "_raw100"
        envFrom:
          # DB_HOSTNAME, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD —
          # same secret EASI already injects into jupyterhub workers.
          - secretRef:
              name: EDIT-ME-datacube-index-credentials
          - secretRef:
              name: EDIT-ME-aws-credentials-secret
        resources:
          requests:
            cpu: "EDIT-ME"      # e.g. "2" — one tile-year at a time, --jobs 1
            memory: "EDIT-ME"   # e.g. "8Gi"
          limits:
            cpu: "EDIT-ME"
            memory: "EDIT-ME"
        # EDIT-ME: pin to whatever node pool/toleration EASI uses for batch
        # workloads, so this doesn't land on the same node as the jupyterhub
        # pod and steal its 36 cores.
        nodeSelector:
          EDIT-ME-node-pool-label: "EDIT-ME"
      retryStrategy:
        limit: "2"   # a tile that fails twice needs a human, not a third guess
