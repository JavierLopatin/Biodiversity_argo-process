# biodiv-map-inference — fan out scripts/73_map_inference.py over tiles
# still missing from S3.
#
#   argo submit -n <ns> --from workflowtemplate/biodiv-map-inference \
#     -p limit-tiles=3 -p num-chunks=3
#
# DAG: list-missing (S3 vs. tile list) -> split into per-pod chunks ->
# process-chunk (fan-out, one pod per chunk). Steps hand off through Argo
# artifacts (S3-backed), not a shared volume, so any pod can retry alone.
#
# MUST run inside the EASI Kubernetes cluster: the pipeline calls
# datacube.Datacube() against the Data Cube Chile ODC index, which only
# answers from inside EASI. There is no public STAC fallback in this code
# path — see the repo README.
#
# Modeled on a working EASI WorkflowTemplate (lemu-national.yaml) rather
# than guessed from scratch:
#   - Pods pull this repo via git-sync onto PYTHONPATH instead of a custom
#     image baking in code. list-missing/split-tiles are dask/vector-only
#     and don't touch the datacube; process-chunk does, so only it mounts
#     the db-config secret.
#   - git-sync points at the PRIVATE Biodiversity_Chile repo (not the
#     public Biodiversity_argo-process mirror), because that's the only
#     copy that also has the model checkpoints and derived parquet files
#     process-chunk needs (results/models_unified_topofix/...,
#     data/derived/*_unified_padded.parquet) — see the repo README for
#     which of those are and aren't safe to hand to a public repo. Pulling
#     the private repo into a pod isn't new exposure: it's the same data
#     Javier's own jupyterhub pod already has, same cluster, same user.
#   - No AWS secret is wired in below — the lemu example doesn't use one
#     either despite writing to S3, which points at IRSA (the pod's
#     serviceAccountName carrying an IAM role) rather than a static
#     credential Secret. EDIT-ME: confirm this with EASI admins; if
#     Javier's service account isn't wired for IRSA, list-missing and
#     process-chunk both need an explicit secretRef added back.
#   - base-image below is the same shared EASI image lemu uses (datacube,
#     dask, geopandas). EDIT-ME: our process-chunk additionally needs
#     torch + rasterio (models_conv.py, maptask.py) — confirm those are
#     already in that image, or this needs its own image built FROM it, or
#     an installer initContainer. Don't assume; check before the test run.
#
# Test run defaults: 3 tiles, 1 per pod, parallelism 3. Once verified,
# raise limit-tiles/num-chunks together and bump parallelism — with EASI
# admins, since this shares the ODC index and node pool with the
# jupyterhub pod's chile_gw/chile_pod load.
#
# Dedup / "don't repeat finished tiles": no separate progress tracker to
# keep in sync. list-missing runs argo/tile_progress.py, which lists what's
# actually in S3 and only treats a tile as done once every requested year
# exists there. That's the same script you can run by hand for a live
# progress check, independent of this workflow or the pod's own
# STATUS.json:
#
#   python argo/tile_progress.py --tiles-csv results/figures/tiles_native_10km_run.csv \
#     --s3-dest s3://easido-prod-user-scratch/<userid>/biodiv/maps/chile_30m_2000_2026 \
#     --years 2000-2026

apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: biodiv-map-inference
  labels:
    name: biodiv-map-inference
    owner: "jlopatin"          # EDIT-ME if EASI expects a different value
    team: "EDIT-ME"
spec:
  entrypoint: main
  serviceAccountName: EDIT-ME   # e.g. data-pipelines-default — ask EASI admins
  parallelism: 3                 # test run: 3 pods max. Raise once verified.
  podGC:
    strategy: OnWorkflowSuccess
  artifactGC:
    strategy: OnWorkflowDeletion
    serviceAccountName: EDIT-ME  # same as above, usually

  arguments:
    parameters:
      - name: base-image
        # Same shared EASI image lemu-national uses. EDIT-ME: confirm it has
        # torch + rasterio for process-chunk, or point this at your own image.
        value: "444488357543.dkr.ecr.us-west-2.amazonaws.com/easi-workflows-base:develop.latest"
      - name: repo-url
        value: "https://github.com/JavierLopatin/Biodiversity_Chile.git"   # private
      - name: repo-branch
        value: main   # EDIT-ME if the working branch differs
      - name: git-secret
        value: EDIT-ME-biodiversity-chile-git-ro-access
      - name: git-image
        value: "registry.k8s.io/git-sync/git-sync:v4.5.0"
      - name: db-config-secret
        # Secret with key `.datacube.conf`, same pattern as lemu's
        # easi-odc-v2-user-db — ask EASI admins for Javier's equivalent.
        value: EDIT-ME-odc-user-db
      - name: s3-dest
        # Same destination the pod's own chile_gw/chile_pod workers write to.
        value: "s3://easido-prod-user-scratch/EDIT-ME-aws-userid/biodiv/maps/chile_30m_2000_2026"
      - name: years
        value: "2000-2026"
      - name: tag
        value: "argo-test1"
      - name: limit-tiles
        # Test run: only take the first 3 tiles tile_progress.py finds
        # actually missing in S3. "0" = full remaining backlog.
        value: "3"
      - name: num-chunks
        # 1 tile per pod for the test (3 tiles -> 3 pods). Scale by raising
        # limit-tiles/num-chunks together with parallelism, not by putting
        # more than one tile per pod.
        value: "3"

  volumes:
    - name: work
      emptyDir:
        sizeLimit: 20Gi

  templates:
    # ----------------------------------------------------------------- #
    - name: main
      dag:
        tasks:
          - name: list-missing
            template: list-missing

          - name: split-tiles
            template: split-tiles
            depends: "list-missing"
            arguments:
              artifacts:
                - {name: missing-csv, from: "{{tasks.list-missing.outputs.artifacts.missing-csv}}"}

          - name: process-chunk
            template: process-chunk
            depends: "split-tiles"
            withParam: "{{tasks.split-tiles.outputs.parameters.chunk-ids}}"
            arguments:
              parameters:
                - {name: chunk-id, value: "{{item}}"}
              artifacts:
                - {name: chunk-csv, from: "{{tasks.split-tiles.outputs.artifacts.chunks}}/chunk_{{item}}.csv"}

    # ----------------------------------------------------------------- #
    # Vector/S3-only: no datacube access, so no db-config mount.
    # Lists S3 under s3-dest, compares against the tiles CSV that comes
    # with the git-synced repo, writes the tiles still missing a year.
    - name: list-missing
      retryStrategy: {limit: 2, retryPolicy: OnError}
      volumes:
        - &git-data-vol {name: git-data, emptyDir: {}}
        - &git-secret-vol
          name: git-secret
          secret:
            secretName: "{{workflow.parameters.git-secret}}"
      initContainers: &git-sync-init
        - name: git-sync
          image: "{{workflow.parameters.git-image}}"
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -c]
          args:
            - |
              exec /git-sync \
                --repo="{{workflow.parameters.repo-url}}" \
                --ref="{{workflow.parameters.repo-branch}}" \
                --root=/git --link=repo --one-time --depth=1
          volumeMounts:
            - {name: git-data, mountPath: /git}
            - {name: git-secret, mountPath: /secret/git, readOnly: true}
          # EDIT-ME: lemu authenticates git-sync via a GitHub App
          # (GITSYNC_GITHUB_APP_*, see lemu-national.yaml). A plain
          # read-only deploy key is simpler if that's what git-secret holds
          # instead — set GITSYNC_USERNAME/GITSYNC_PASSWORD_FILE or
          # GITSYNC_SSH env vars to match whatever's actually in the secret.
      container:
        image: "{{workflow.parameters.base-image}}"
        command: [bash, -c]
        args:
          - |
            python /git/repo/argo/tile_progress.py \
              --tiles-csv /git/repo/results/figures/tiles_native_10km_run.csv \
              --s3-dest "{{workflow.parameters.s3-dest}}" \
              --years "{{workflow.parameters.years}}" \
              --limit "{{workflow.parameters.limit-tiles}}" \
              --out /work/missing_tiles.csv
        env:
          - &env-pythonpath {name: PYTHONPATH, value: /git/repo}
        volumeMounts:
          - &mount-work {name: work, mountPath: /work}
          - &mount-git-data {name: git-data, mountPath: /git}
        resources: {requests: {cpu: "1750m", memory: 3.5Gi}, limits: {cpu: "1750m", memory: 3.5Gi}}
      outputs:
        artifacts: [{name: missing-csv, path: /work/missing_tiles.csv}]

    # ----------------------------------------------------------------- #
    # Splits missing_tiles.csv into num-chunks roughly-equal chunk files,
    # one per pod. No datacube access.
    - name: split-tiles
      inputs:
        artifacts: [{name: missing-csv, path: /work/missing_tiles.csv}]
      container:
        image: "{{workflow.parameters.base-image}}"
        command: [python, -c]
        args:
          - |
            import csv, json, math, os

            rows = list(csv.reader(open("/work/missing_tiles.csv")))
            header, rows = rows[0], rows[1:]
            n = int(os.environ["NUM_CHUNKS"])
            os.makedirs("/work/chunks", exist_ok=True)
            size = math.ceil(len(rows) / n) if rows else 0
            ids = []
            for i in range(n):
                part = rows[i * size:(i + 1) * size] if size else []
                if not part:
                    continue
                ids.append(str(i))
                with open(f"/work/chunks/chunk_{i}.csv", "w", newline="") as f:
                    w = csv.writer(f)
                    w.writerow(header)
                    w.writerows(part)
            json.dump(ids, open("/work/chunk_ids.json", "w"))
        env: [{name: NUM_CHUNKS, value: "{{workflow.parameters.num-chunks}}"}]
        volumeMounts: [*mount-work]
        resources: {requests: {cpu: "500m", memory: 512Mi}, limits: {cpu: "500m", memory: 512Mi}}
      outputs:
        artifacts: [{name: chunks, path: /work/chunks}]
        parameters:
          - {name: chunk-ids, valueFrom: {path: /work/chunk_ids.json}}

    # ----------------------------------------------------------------- #
    # One pod per chunk: same entry point the pod's own chile_gw/chile_pod
    # workers use, --resume so a rerun skips tiles finished meanwhile.
    # This is the only template touching the datacube, so it's the only
    # one mounting db-config.
    - name: process-chunk
      inputs:
        parameters: [{name: chunk-id}]
        artifacts: [{name: chunk-csv, path: /work/chunk.csv}]
      retryStrategy: {limit: 2, retryPolicy: OnError}
      activeDeadlineSeconds: EDIT-ME   # unknown until the 3-tile test measures one; lemu used ~2400s for a comparable single-cell datacube step
      metadata:
        annotations:
          karpenter.sh/do-not-disrupt: "true"   # don't evict mid-tile
      volumes:
        - *git-data-vol
        - *git-secret-vol
        - &db-config-vol
          name: db-config
          secret:
            secretName: "{{workflow.parameters.db-config-secret}}"
            items: [{key: .datacube.conf, path: .datacube.conf}]
      initContainers: *git-sync-init
      container:
        image: "{{workflow.parameters.base-image}}"
        workingDir: /git/repo
        command: [python, scripts/73_map_inference.py]
        args:
          - --tiles-file
          - /work/chunk.csv
          - --dest
          - "{{workflow.parameters.s3-dest}}"
          - --years
          - "{{workflow.parameters.years}}"
          - --resume
          - --workers
          - "0"          # dask off inside the pod — parallelism is pod count, not threads
          - --jobs
          - "1"
          - --device
          - cpu
          - --tag
          - "{{workflow.parameters.tag}}-{{inputs.parameters.chunk-id}}"
        env:
          - *env-pythonpath
          - {name: ODC_CONFIG_PATH, value: /secret/dc/.datacube.conf}
          - {name: DATACUBE_CONFIG_PATH, value: /secret/dc/.datacube.conf}
          - {name: BIODIV_UNIFIED, value: "1"}
          - {name: BIODIV_CURVES, value: "_raw100"}
        volumeMounts:
          - *mount-work
          - *mount-git-data
          - {name: db-config, mountPath: /secret/dc}
        # EDIT-ME: sizing guess only, from lemu's comparable single-cell
        # datacube step (cpu 7 / 28Gi) — --jobs 1 --workers 0 here means
        # single-threaded, so this is probably high; tighten after the
        # 3-tile test shows real usage.
        resources:
          requests: {cpu: "4", memory: 16Gi}
          limits: {cpu: "4", memory: 16Gi}
        # EDIT-ME: pin to whatever node pool/toleration EASI uses for batch
        # workloads, so this doesn't land on the same node as the
        # jupyterhub pod and steal its 36 cores.
        nodeSelector:
          EDIT-ME-node-pool-label: "EDIT-ME"
